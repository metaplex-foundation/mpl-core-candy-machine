name: Deploy Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag (release/candy-machine-core@0.2.2 or release/candy-guard@0.2.1) or commit to deploy
        required: true
        type: string
        default: release/candy-guard@0.2.2
      program:
        description: Program (required if not a release tag)
        required: false
        type: choice
        options:
          - candy-guard
          - candy-machine-core
      cluster:
        description: Cluster environment
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet-beta
          - sonic-devnet
          - sonic-testnet
          - eclipse-mainnet
          - eclipse-devnet
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: false

env:
  CACHE: true

jobs:
  check_tag:
    name: 'Check tag'
    runs-on: ubuntu-latest
    outputs:
      program: ${{ steps.set_program.outputs.program }}
      type: ${{ steps.set_program.outputs.type }}
    steps:
    - name: Check tag
      id: set_program
      run: |
        if [[ "${{ inputs.git_ref }}" =~ ^release/candy-guard@* ]]; then
          echo program="candy-guard" >> $GITHUB_OUTPUT
          echo type="release" >> $GITHUB_OUTPUT
        elif [[ "${{ inputs.git_ref }}" =~ ^release/candy-machine-core@* ]]; then
          echo program="candy-machine-core" >> $GITHUB_OUTPUT
          echo type="release" >> $GITHUB_OUTPUT
        elif [[ "${{ inputs.git_ref }}" == "candy-machine-core" || "${{ inputs.git_ref }}" == "candy-guard" ]]; then
          echo program="${{ inputs.program }}" >> $GITHUB_OUTPUT
          echo type="ref" >> $GITHUB_OUTPUT
        else
          echo "Non-release tag and program not specified"
          exit 1;
        fi

  build_programs:
    name: Programs
    uses: ./.github/workflows/build-programs.yml
    secrets: inherit
    needs: check_tag
    if: needs.check_tag.outputs.type == 'ref'
    with:
      git_ref: ${{ inputs.git_ref }}

  test_js:
    name: JS client
    needs: build_programs
    uses: ./.github/workflows/test-js.yml
    secrets: inherit
    with:
      git_ref: ${{ inputs.git_ref }}

  deploy_program:
    name: Program / Deploy
    runs-on: ubuntu-latest
    needs: [test_js, check_tag]
    if: always() && (needs.test_js.result == 'success' || needs.test_js.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Load environment variables
        id: env_vars
        run: |
          grep -E '^(RUST_VERSION|DEPLOY_SOLANA_VERSION|SOLANA_VERIFY_VERSION|SOLANA_VERIFY_BASE_IMAGE|COMMIT_USER_NAME|COMMIT_USER_EMAIL)=' .github/.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              RUST_VERSION) printf 'rust_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              DEPLOY_SOLANA_VERSION) printf 'deploy_solana_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < .github/.env

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ steps.env_vars.outputs.rust_version }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ steps.env_vars.outputs.deploy_solana_version }}
          cache: ${{ env.CACHE }}

      # solana-verify is only used for verified-build PDA upload on mainnet-beta.
      # Skipped for dry runs and non-mainnet clusters so devnet/sonic/eclipse
      # deploys stay lean. Verification also requires `type == 'ref'` because the
      # PDA records a source commit, which release-asset deploys do not provide
      # in a way that round-trips through `solana-verify verify-from-repo`.
      - name: Install Solana Verify
        if: github.event.inputs.dry_run == 'false' && inputs.cluster == 'mainnet-beta' && needs.check_tag.outputs.type == 'ref'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          cargo install solana-verify --locked --force --version "${SOLANA_VERIFY_VERSION}"

      - name: Install cargo-release
        uses: metaplex-foundation/actions/install-cargo-release@v1
        if: github.event.inputs.publish_crate == 'true' && github.event.inputs.dry_run == 'false'
        with:
          cache: ${{ env.CACHE }}

      - name: Set RPC
        run: |
          # We do this if waterfall because github actions does not allow dynamic access to secrets
          if [ "${{ inputs.cluster }}" == "devnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.DEVNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "mainnet-beta" ]; then
            printf 'RPC=%s\n' "${{ secrets.MAINNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "sonic-devnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.SONIC_DEVNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "sonic-testnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.SONIC_TESTNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "eclipse-devnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.ECLIPSE_DEVNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "eclipse-testnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.ECLIPSE_TESTNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "eclipse-mainnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.ECLIPSE_MAINNET_RPC }}" >> "$GITHUB_ENV"
          fi

      - name: Identify Program
        env:
          CORE_CANDY_MACHINE_SONIC_DEPLOY_KEY: ${{ secrets.CORE_CANDY_MACHINE_SONIC_DEPLOY_KEY }}
          CORE_CANDY_MACHINE_ECLIPSE_DEPLOY_KEY: ${{ secrets.CORE_CANDY_MACHINE_ECLIPSE_DEPLOY_KEY }}
          CORE_CANDY_GUARD_DEPLOY_KEY: ${{ secrets.CORE_CANDY_GUARD_DEPLOY_KEY }}
          CORE_CANDY_GUARD_ID: ${{ secrets.CORE_CANDY_GUARD_ID }}
          CORE_CANDY_MACHINE_CORE_DEPLOY_KEY: ${{ secrets.CORE_CANDY_MACHINE_CORE_DEPLOY_KEY }}
          CORE_CANDY_MACHINE_CORE_ID: ${{ secrets.CORE_CANDY_MACHINE_CORE_ID }}
        run: |
          if [[ "${{ inputs.cluster }}" == "sonic"* ]]; then
            printf '%s' "$CORE_CANDY_MACHINE_SONIC_DEPLOY_KEY" > ./deploy-key.json
          elif [[ "${{ inputs.cluster }}" == "eclipse"* ]]; then
            printf '%s' "$CORE_CANDY_MACHINE_ECLIPSE_DEPLOY_KEY" > ./deploy-key.json
          fi
          if [ "${{ needs.check_tag.outputs.program }}" == "candy-guard" ]; then
            if [ ! -e "./deploy-key.json" ]; then
              printf '%s' "$CORE_CANDY_GUARD_DEPLOY_KEY" > ./deploy-key.json
            fi
            printf '%s' "$CORE_CANDY_GUARD_ID" > ./program-id.json
            printf 'PROGRAM_NAME=%s\n' "mpl_core_candy_guard" >> "$GITHUB_ENV"
            printf 'PROGRAM_PACKAGE=%s\n' "mpl-core-candy-guard" >> "$GITHUB_ENV"
          else
            if [ ! -e "./deploy-key.json" ]; then
              printf '%s' "$CORE_CANDY_MACHINE_CORE_DEPLOY_KEY" > ./deploy-key.json
            fi
            printf '%s' "$CORE_CANDY_MACHINE_CORE_ID" > ./program-id.json
            printf 'PROGRAM_NAME=%s\n' "mpl_core_candy_machine_core" >> "$GITHUB_ENV"
            printf 'PROGRAM_PACKAGE=%s\n' "mpl-core-candy-machine-core" >> "$GITHUB_ENV"
          fi

      - name: Download Program Builds
        uses: actions/download-artifact@v4
        if: needs.check_tag.outputs.type == 'ref'
        with:
          name: program-builds-${{ inputs.git_ref }}
      
      - name: Download release asset
        uses: actions/github-script@v5
        id: get_release
        if: needs.check_tag.outputs.type == 'release'
        with:
          script: |
            const tag = "${{ inputs.git_ref }}";
            const assetName = "${{ env.PROGRAM_NAME }}.so";

            // Fetch the release associated with the tag
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            
            if (release.status !== 200) {
              throw new Error(`Failed to fetch release for tag ${tag}`);
            }
            
            const asset = release.data.assets.find(asset => asset.name === assetName);
            if (!asset) {
              throw new Error(`Asset ${assetName} not found in release tagged ${tag}`);
            }

            core.setOutput("url", asset.url);

      - name: Download the Selected Asset
        if: needs.check_tag.outputs.type == 'release'
        run: |
          mkdir -p ${{ github.workspace }}/programs/.bin
          curl -L -o ${{ github.workspace }}/programs/.bin/${{ env.PROGRAM_NAME }}.so \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ steps.get_release.outputs.url }}"

      - name: Deploy Program
        if: github.event.inputs.dry_run == 'false'
        run: |
          echo "Deploying ${{ needs.check_tag.outputs.program }} to ${{ inputs.cluster }}"

          solana -v program deploy "./programs/.bin/${PROGRAM_NAME}.so" \
            -u "${RPC}" \
            --program-id ./program-id.json \
            -k ./deploy-key.json \
            --max-sign-attempts 100 \
            --use-rpc

      # solana-verify 0.4.15 unconditionally loads ~/.config/solana/cli/config.yml
      # during PDA upload (Ellipsis-Labs/solana-verifiable-build process_otter_verify_ixs),
      # so initialize a CLI config even though --keypair and --url are passed explicitly.
      - name: Initialize Solana CLI config for solana-verify
        if: github.event.inputs.dry_run == 'false' && inputs.cluster == 'mainnet-beta' && needs.check_tag.outputs.type == 'ref'
        run: |
          solana config set \
            --url "${RPC}" \
            --keypair "${GITHUB_WORKSPACE}/deploy-key.json"

      - name: Upload verified-build PDA
        if: github.event.inputs.dry_run == 'false' && inputs.cluster == 'mainnet-beta' && needs.check_tag.outputs.type == 'ref'
        run: |
          PROGRAM_ID="$(solana-keygen pubkey ./program-id.json)"
          COMMIT_HASH="$(git rev-parse HEAD)"

          solana-verify verify-from-repo \
            --current-dir \
            --program-id "${PROGRAM_ID}" \
            --url "${RPC}" \
            --keypair ./deploy-key.json \
            --base-image "${SOLANA_VERIFY_BASE_IMAGE}" \
            --library-name "${PROGRAM_NAME}" \
            --mount-path programs \
            --commit-hash "${COMMIT_HASH}" \
            --skip-prompt \
            https://github.com/metaplex-foundation/mpl-core-candy-machine.git \
            -- \
            --package "${PROGRAM_PACKAGE}"

      - name: Submit remote verification job
        if: github.event.inputs.dry_run == 'false' && inputs.cluster == 'mainnet-beta' && needs.check_tag.outputs.type == 'ref'
        run: |
          PROGRAM_ID="$(solana-keygen pubkey ./program-id.json)"
          UPLOADER="$(solana-keygen pubkey ./deploy-key.json)"

          solana-verify remote submit-job \
            --url "${RPC}" \
            --program-id "${PROGRAM_ID}" \
            --uploader "${UPLOADER}"

      - name: Publish crate
        working-directory: ./programs/${{ needs.check_tag.outputs.program }}/program
        if: github.event.inputs.publish_crate == 'true' && github.event.inputs.cluster == 'mainnet-beta' && github.event.inputs.dry_run == 'false'
        run: |
          git stash
          git config user.name "${COMMIT_USER_NAME}"
          git config user.email "${COMMIT_USER_EMAIL}"

          cargo login ${{ secrets.CRATES_TOKEN }}
          cargo release ${{ inputs.bump }} --no-confirm --no-push --no-tag --execute

          git reset --soft HEAD~1
          git stash pop

      - name: Create env tag
        if: github.event.inputs.dry_run == 'false'
        uses: actions/github-script@v5
        with:
          script: |
            const refData = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/${{ inputs.git_ref }}'
            });
            if (refData.status !== 200) {
              throw new Error('Failed to fetch existing tag');
            }
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ needs.check_tag.outputs.program }}-${{ inputs.cluster }}',
              sha: refData.data.object.sha
            });

      - name: Clean up signer files
        if: always()
        run: rm -f ./deploy-key.json ./program-id.json
