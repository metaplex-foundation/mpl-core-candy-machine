name: Main

# Thin orchestrator over the shared workflows in metaplex-foundation/actions.
# Repository facts live in .github/.env (toolchain pins), .github/programs.json
# (program descriptors) and .github/file-filters.yml (change detection).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  changes:
    name: Detect changes
    uses: metaplex-foundation/actions/.github/workflows/detect-changes.yml@da62cf9659efdd4e28daa0c777535ea5f54ab53a # v2.0.0
    permissions:
      contents: read
      pull-requests: read

  build_programs:
    name: Programs
    if: needs.changes.outputs.any == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@da62cf9659efdd4e28daa0c777535ea5f54ab53a # v2.0.0
    permissions:
      contents: read
    with:
      runner: ubuntu-latest-16-cores

  test_programs:
    name: Programs
    if: needs.changes.outputs.programs == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/test-programs.yml@da62cf9659efdd4e28daa0c777535ea5f54ab53a # v2.0.0
    permissions:
      contents: read
    with:
      program_matrix: ${{ needs.changes.outputs.program_matrix }}

  generate_clients:
    name: Generate clients
    if: needs.changes.outputs.any == 'true'
    needs: [changes, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/generate-clients.yml@da62cf9659efdd4e28daa0c777535ea5f54ab53a # v2.0.0
    permissions:
      contents: read
    with:
      runner: ubuntu-latest-8-cores

  test_js:
    name: JS Client
    if: needs.changes.outputs.js_client == 'true'
    needs: [changes, generate_clients]
    uses: metaplex-foundation/actions/.github/workflows/test-js-client.yml@da62cf9659efdd4e28daa0c777535ea5f54ab53a # v2.0.0
    permissions:
      contents: read
