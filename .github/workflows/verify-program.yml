name: Verify Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag (release/candy-machine-core@0.2.2 or release/candy-guard@0.2.1) or commit to verify
        required: true
        type: string
        default: release/candy-guard@0.2.2
      program:
        description: Program (required if not a release tag)
        required: false
        type: choice
        options:
          - candy-guard
          - candy-machine-core
      cluster:
        description: Cluster environment
        required: true
        default: mainnet-beta
        type: choice
        options:
          - mainnet-beta

env:
  CACHE: true

jobs:
  check_tag:
    name: 'Check tag'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      program: ${{ steps.set_program.outputs.program }}
      type: ${{ steps.set_program.outputs.type }}
    steps:
    # `inputs.git_ref` and `inputs.program` are workflow_dispatch strings that a
    # caller can craft freely; piping them through step `env:` avoids GitHub
    # Actions template expansion into the shell, which would otherwise let a
    # malicious dispatch inject arbitrary commands into this job.
    - name: Check tag
      id: set_program
      env:
        GIT_REF: ${{ inputs.git_ref }}
        INPUT_PROGRAM: ${{ inputs.program }}
      run: |
        if [[ "${GIT_REF}" =~ ^release/candy-guard@* ]]; then
          echo program="candy-guard" >> "$GITHUB_OUTPUT"
          echo type="release" >> "$GITHUB_OUTPUT"
        elif [[ "${GIT_REF}" =~ ^release/candy-machine-core@* ]]; then
          echo program="candy-machine-core" >> "$GITHUB_OUTPUT"
          echo type="release" >> "$GITHUB_OUTPUT"
        elif [[ -n "${INPUT_PROGRAM}" && ("${INPUT_PROGRAM}" == "candy-machine-core" || "${INPUT_PROGRAM}" == "candy-guard") ]]; then
          # For non-release git_refs (commit hash, branch, arbitrary tag), the
          # program cannot be inferred from the ref name, so the dispatch must
          # supply `program` explicitly. We diverge from deploy-program.yml's
          # check_tag here — that workflow's third branch only fires when
          # git_ref equals the literal string "candy-guard" or
          # "candy-machine-core", which makes re-verifying a specific commit
          # impossible. Verify only needs the source at a commit, so we accept
          # any git_ref as long as `program` is set.
          echo program="${INPUT_PROGRAM}" >> "$GITHUB_OUTPUT"
          echo type="ref" >> "$GITHUB_OUTPUT"
        else
          echo "Non-release git_ref and program not specified"
          exit 1;
        fi

  verify_program:
    name: Program / Verify
    needs: check_tag
    runs-on: ubuntu-latest-16-cores
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          # No git push/fetch happens after this step in this workflow, so
          # don't leave GITHUB_TOKEN in .git/config where a later step (or a
          # compromised third-party action in this job) could read it.
          persist-credentials: false

      - name: Load environment variables
        id: env_vars
        run: |
          grep -E '^(RUST_VERSION|DEPLOY_SOLANA_VERSION|SOLANA_VERIFY_VERSION|SOLANA_VERIFY_BASE_IMAGE)=' .github/.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              RUST_VERSION) printf 'rust_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              DEPLOY_SOLANA_VERSION) printf 'deploy_solana_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < .github/.env

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ steps.env_vars.outputs.rust_version }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ steps.env_vars.outputs.deploy_solana_version }}
          cache: ${{ env.CACHE }}

      - name: Install Solana Verify
        run: cargo install solana-verify --locked --force --version "${SOLANA_VERIFY_VERSION}"

      - name: Set RPC
        run: |
          if [ "${{ inputs.cluster }}" == "mainnet-beta" ]; then
            printf 'RPC=%s\n' "${{ secrets.MAINNET_RPC }}" >> "$GITHUB_ENV"
          else
            echo "Invalid cluster: ${{ inputs.cluster }}"
            exit 1
          fi

      - name: Identify Program
        env:
          CORE_CANDY_GUARD_ID: ${{ secrets.CORE_CANDY_GUARD_ID }}
          CORE_CANDY_GUARD_DEPLOY_KEY: ${{ secrets.CORE_CANDY_GUARD_DEPLOY_KEY }}
          CORE_CANDY_MACHINE_CORE_ID: ${{ secrets.CORE_CANDY_MACHINE_CORE_ID }}
          CORE_CANDY_MACHINE_CORE_DEPLOY_KEY: ${{ secrets.CORE_CANDY_MACHINE_CORE_DEPLOY_KEY }}
        run: |
          if [ "${{ needs.check_tag.outputs.program }}" == "candy-guard" ]; then
            printf 'PROGRAM_NAME=%s\n' "mpl_core_candy_guard" >> "$GITHUB_ENV"
            printf 'PROGRAM_PACKAGE=%s\n' "mpl-core-candy-guard" >> "$GITHUB_ENV"
            printf '%s' "$CORE_CANDY_GUARD_ID" > ./program-id.json
            printf '%s' "$CORE_CANDY_GUARD_DEPLOY_KEY" > ./deploy-key.json
          else
            printf 'PROGRAM_NAME=%s\n' "mpl_core_candy_machine_core" >> "$GITHUB_ENV"
            printf 'PROGRAM_PACKAGE=%s\n' "mpl-core-candy-machine-core" >> "$GITHUB_ENV"
            printf '%s' "$CORE_CANDY_MACHINE_CORE_ID" > ./program-id.json
            printf '%s' "$CORE_CANDY_MACHINE_CORE_DEPLOY_KEY" > ./deploy-key.json
          fi

      # solana-verify 0.4.15 unconditionally loads ~/.config/solana/cli/config.yml
      # during PDA upload (Ellipsis-Labs/solana-verifiable-build process_otter_verify_ixs),
      # so initialize a CLI config even though --keypair and --url are passed explicitly.
      - name: Initialize Solana CLI config for solana-verify
        run: |
          solana config set \
            --url "${RPC}" \
            --keypair "${GITHUB_WORKSPACE}/deploy-key.json"

      - name: Upload verified-build PDA
        run: |
          PROGRAM_ID="$(solana-keygen pubkey ./program-id.json)"
          COMMIT_HASH="$(git rev-parse HEAD)"

          solana-verify verify-from-repo \
            --current-dir \
            --program-id "${PROGRAM_ID}" \
            --url "${RPC}" \
            --keypair ./deploy-key.json \
            --base-image "${SOLANA_VERIFY_BASE_IMAGE}" \
            --library-name "${PROGRAM_NAME}" \
            --mount-path programs \
            --commit-hash "${COMMIT_HASH}" \
            --skip-prompt \
            https://github.com/metaplex-foundation/mpl-core-candy-machine.git \
            -- \
            --package "${PROGRAM_PACKAGE}"

      - name: Submit remote verification job
        run: |
          PROGRAM_ID="$(solana-keygen pubkey ./program-id.json)"
          UPLOADER="$(solana-keygen pubkey ./deploy-key.json)"

          solana-verify remote submit-job \
            --url "${RPC}" \
            --program-id "${PROGRAM_ID}" \
            --uploader "${UPLOADER}"

      - name: Clean up signer files
        if: always()
        run: rm -f ./deploy-key.json ./program-id.json
