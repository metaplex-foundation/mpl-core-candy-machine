name: Verify Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag, commit hash, or branch that was deployed
        required: true
        type: string
      program:
        description: Program
        required: true
        default: candy-machine-core
        type: choice
        options: [candy-machine-core, candy-guard]
      cluster:
        description: Cluster environment
        required: true
        default: mainnet-beta
        type: choice
        options: [mainnet-beta]

permissions: {}

jobs:
  verify:
    name: Program
    uses: metaplex-foundation/actions/.github/workflows/verify-program.yml@782403d54939dc66861d8d7c036d6a313d5da37d # v2.0.0
    permissions:
      contents: read
    secrets:
      RPC_URL: ${{ secrets.MAINNET_RPC }}
      PROGRAM_ID_KEYPAIR: >-
        ${{ inputs.program == 'candy-machine-core' && secrets.CORE_CANDY_MACHINE_CORE_ID
         || inputs.program == 'candy-guard' && secrets.CORE_CANDY_GUARD_ID
         || '' }}
      DEPLOYER_KEYPAIR: >-
        ${{ inputs.program == 'candy-machine-core' && inputs.cluster == 'devnet' && secrets.CORE_CANDY_MACHINE_CORE_DEPLOY_KEY
         || inputs.program == 'candy-machine-core' && inputs.cluster == 'mainnet-beta' && secrets.CORE_CANDY_MACHINE_CORE_DEPLOY_KEY
         || inputs.program == 'candy-machine-core' && startsWith(inputs.cluster, 'sonic') && secrets.CORE_CANDY_MACHINE_SONIC_DEPLOY_KEY
         || inputs.program == 'candy-machine-core' && startsWith(inputs.cluster, 'eclipse') && secrets.CORE_CANDY_MACHINE_ECLIPSE_DEPLOY_KEY
         || inputs.program == 'candy-guard' && inputs.cluster == 'devnet' && secrets.CORE_CANDY_GUARD_DEPLOY_KEY
         || inputs.program == 'candy-guard' && inputs.cluster == 'mainnet-beta' && secrets.CORE_CANDY_GUARD_DEPLOY_KEY
         || inputs.program == 'candy-guard' && startsWith(inputs.cluster, 'sonic') && secrets.CORE_CANDY_MACHINE_SONIC_DEPLOY_KEY
         || inputs.program == 'candy-guard' && startsWith(inputs.cluster, 'eclipse') && secrets.CORE_CANDY_MACHINE_ECLIPSE_DEPLOY_KEY
         || '' }}
    with:
      program: ${{ inputs.program }}
      cluster: ${{ inputs.cluster }}
      git_ref: ${{ inputs.git_ref }}
      runner: ubuntu-latest-16-cores
