name: Verify Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag, commit hash, or branch that was deployed
        required: true
        type: string
      program:
        description: Program
        required: true
        default: candy-machine-core
        type: choice
        options:
          - candy-machine-core
          - candy-guard
      cluster:
        description: Cluster environment
        required: true
        default: mainnet-beta
        type: choice
        options:
          - mainnet-beta

env:
  CACHE: true

jobs:
  verify_program:
    name: Program / Verify
    runs-on: ubuntu-latest-16-cores
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Load environment variables
        id: env_vars
        run: |
          grep -E '^(RUST_VERSION|SOLANA_VERSION|DEPLOY_SOLANA_VERSION|SOLANA_VERIFY_VERSION)=' .github/.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              RUST_VERSION) printf 'rust_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              DEPLOY_SOLANA_VERSION) printf 'deploy_solana_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < .github/.env

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ steps.env_vars.outputs.rust_version }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ steps.env_vars.outputs.deploy_solana_version }}
          cache: ${{ env.CACHE }}

      - name: Install solana-verify
        uses: metaplex-foundation/actions/install-solana-verify@v1
        with:
          version: ${{ env.SOLANA_VERIFY_VERSION }}

      - name: Set RPC
        run: |
          if [ "${{ inputs.cluster }}" == "mainnet-beta" ]; then
            printf 'RPC=%s\n' "${{ secrets.MAINNET_RPC }}" >> "$GITHUB_ENV"
          else
            echo "Invalid cluster: ${{ inputs.cluster }}"
            exit 1
          fi

      - name: Identify Program
        env:
          CORE_CANDY_GUARD_DEPLOY_KEY: ${{ secrets.CORE_CANDY_GUARD_DEPLOY_KEY }}
          CORE_CANDY_GUARD_ID: ${{ secrets.CORE_CANDY_GUARD_ID }}
          CORE_CANDY_MACHINE_CORE_DEPLOY_KEY: ${{ secrets.CORE_CANDY_MACHINE_CORE_DEPLOY_KEY }}
          CORE_CANDY_MACHINE_CORE_ID: ${{ secrets.CORE_CANDY_MACHINE_CORE_ID }}
        run: |
          if [ "${{ inputs.program }}" == "candy-guard" ]; then
            printf '%s' "$CORE_CANDY_GUARD_DEPLOY_KEY" > ./deploy-key.json
            printf '%s' "$CORE_CANDY_GUARD_ID" > ./program-id.json
            echo PROGRAM_NAME="mpl_core_candy_guard" >> $GITHUB_ENV
            echo PROGRAM_PACKAGE="mpl-core-candy-guard" >> $GITHUB_ENV
            echo PROGRAM_MOUNT_PATH="." >> $GITHUB_ENV
          else
            printf '%s' "$CORE_CANDY_MACHINE_CORE_DEPLOY_KEY" > ./deploy-key.json
            printf '%s' "$CORE_CANDY_MACHINE_CORE_ID" > ./program-id.json
            echo PROGRAM_NAME="mpl_core_candy_machine_core" >> $GITHUB_ENV
            echo PROGRAM_PACKAGE="mpl-core-candy-machine-core" >> $GITHUB_ENV
            echo PROGRAM_MOUNT_PATH="." >> $GITHUB_ENV
          fi

      - name: Verify program
        uses: metaplex-foundation/actions/verify-program@v1
        with:
          program-id-keypair: ./program-id.json
          keypair: ./deploy-key.json
          rpc-url: ${{ env.RPC }}
          library-name: ${{ env.PROGRAM_NAME }}
          package: ${{ env.PROGRAM_PACKAGE }}
          mount-path: ${{ env.PROGRAM_MOUNT_PATH }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Clean up signer files
        if: always()
        run: rm -f ./deploy-key.json ./program-id.json
