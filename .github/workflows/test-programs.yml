name: Test Programs

on:
  workflow_call:
    inputs:
      program_matrix:
        type: string
      git_ref:
        type: string

env:
  CACHE: true

jobs:
  test_programs:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        program: ${{ fromJson(inputs.program_matrix) }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Load environment variables
        run: cat .github/.env >> $GITHUB_ENV

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ env.IDL_RUST_VERSION }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ env.SOLANA_VERSION }}
          cache: ${{ env.CACHE }}

      - name: Cache program dependencies
        if: env.CACHE == 'true'
        uses: metaplex-foundation/actions/cache-program@v1
        with:
          folder: ./programs/${{ matrix.program }}
          key: program-${{ matrix.program }}

      - name: Set package name
        id: program
        env:
          MATRIX_PROGRAM: ${{ matrix.program }}
        run: |
          case "$MATRIX_PROGRAM" in
            candy-guard)
              printf 'package=%s\n' "mpl-core-candy-guard" >> "$GITHUB_OUTPUT"
              ;;
            candy-machine-core)
              printf 'package=%s\n' "mpl-core-candy-machine-core" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported program: $MATRIX_PROGRAM" >&2
              exit 1
              ;;
          esac

      - name: Run cargo fmt
        run: cargo fmt --manifest-path ./Cargo.toml --package "${{ steps.program.outputs.package }}" -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features --no-deps --manifest-path ./Cargo.toml --package "${{ steps.program.outputs.package }}"

      - name: Run tests
        shell: bash
        working-directory: configs/program-scripts
        run: ./test.sh
        env:
          PROGRAM: ${{ matrix.program }}
